<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google tag (gtag.js), GA4 property G-JH23P418ZX (Riley, Oct 2026).
         GA4's enhanced measurement counts SPA route changes from browser
         history events, so no per-route code is needed. Sets cookies (_ga):
         see the Cookies section of pages/Privacy.tsx. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JH23P418ZX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-JH23P418ZX');
    </script>

    <!-- Meta Pixel (ID 27725227730486901, Riley Oct 2026). The pixel fires
         PageView on load and, by default, on SPA history changes too. Sets the
         _fbp cookie: see the Cookies section of pages/Privacy.tsx. The
         <noscript> fallback image is in <body> (images aren't valid in a
         <noscript> inside <head>). -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '27725227730486901');
      fbq('track', 'PageView');
    </script>
    <title>AI Language Learning with Live Native Speakers | LinkGlobal</title>
    <meta
      name="description"
      content="A personalized AI learning path, live lessons with certified educators, and real conversation with native speakers. For newcomers, students, and professionals."
    />
    <meta name="theme-color" content="#081b33" />
    <!-- %SITE_URL% is replaced at build time (see vite.config.ts). The
         per-page title/description/canonical are updated in the browser by
         src/components/PageMeta.tsx; link-preview scrapers read these
         site-wide defaults. -->
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Link previews (LinkedIn, Facebook, WhatsApp, iMessage, Slack...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LinkGlobal" />
    <meta property="og:title" content="Learn the language. Own the conversation." />
    <meta
      property="og:description"
      content="A personalized AI learning path, live lessons with certified educators, and real conversation with native speakers."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LinkGlobal logo beside a glowing globe connecting cities" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Learn the language. Own the conversation." />
    <meta
      name="twitter:description"
      content="A personalized AI learning path, live lessons with certified educators, and real conversation with native speakers."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Vercel Web Analytics (cookie-free). Needs Analytics enabled for the
         project in the Vercel dashboard; tracks client-side route changes. -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments) }
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
